[project]
name = "precipitate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthew Mahowald", email = "matthew.mahowald@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "onnxruntime>=1.23.2",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "torch>=2.10.0",
    "transformers[torch]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
demo = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.3",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "tqdm>=4.67.2",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = ["I", "ANN", "RUF", "ASYNC", "PTH", "SIM", "FURB"]
ignore = ["ANN003", "ANN002"]
